name: release

# 标签发布的是可审计的项目文档/脚本快照与 OTA 清单快照；固件二进制仍来自
# manifest 中声明的上游 HTTPS 地址，不在本仓库或 Actions 中伪造、重打包或刷写。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 vMAJOR.MINOR.PATCH 标签；手动运行只构建，不创建 Release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: 构建发布资产
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 确定版本标签
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then tag="$INPUT_TAG"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "非法标签: $tag"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$tag^{commit}")" ]] || { echo "检出提交与标签不一致"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 运行发布前检查
        env:
          GITHUB_SHA: ${{ steps.version.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/check-consistency.js --verbose
          node scripts/check-auto-update.js
          node scripts/build-release-metadata.js --version "$RELEASE_TAG" --output "release/ota-manifest-${RELEASE_TAG}.json"
          node scripts/build-release-notes.js "$RELEASE_TAG" outputs/release-notes.md

      - name: 构建源代码快照
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="OpenWrt-Flashing-Guide-RE-CP02-${RELEASE_TAG}/" HEAD \
            -o "release/OpenWrt-Flashing-Guide-RE-CP02-${RELEASE_TAG}.tar.gz"
          (cd release && sha256sum *.tar.gz *.json > SHA256SUMS.txt)

      - name: 上传构建资产
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: release/
          if-no-files-found: error

      - name: 创建 GitHub Release（仅正式标签触发）
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file outputs/release-notes.md \
            --verify-tag
